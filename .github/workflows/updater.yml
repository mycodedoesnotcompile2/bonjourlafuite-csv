name: Daily updater
on:
  workflow_dispatch
  #schedule:
  #  - cron:  '10 03 * * *'
permissions:
  contents: write

env:
  REPO_DIR: /tmp/bonjour-la-fuite
  LEAKS_DIR: /tmp/bonjour-la-fuite/leaks

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set env vars
      run: |
        DEFAULT_OUT_FILE_NAME='bonjourlafuite_eu_org.csv'
        OUT_FILE="/tmp/$DEFAULT_OUT_FILE_NAME"
        REPO_FILE="$GITHUB_WORKSPACE/$DEFAULT_OUT_FILE_NAME"
        
        echo "OUT_FILE=$OUT_FILE" >> $GITHUB_ENV
        echo "REPO_FILE=$REPO_FILE" >> $GITHUB_ENV

    - name: Install prerequisites
      run: |
        pip install -r "$GITHUB_WORKSPACE/_resources/requirements.txt"
    
    - name: Getting latest version
      run: |
        cd /tmp/
        git clone --depth=1 https://framagit.org/aeris/bonjour-la-fuite.git "$REPO_DIR"

    - name: Process latest version
      run: |
        cd /tmp/
        python "$GITHUB_WORKSPACE/_resources/script.py" -d "$LEAKS_DIR" -o "$OUT_FILE"

    - name: Check and push
      run: |
        cd /tmp/
        
        if (( $(wc -c < "$OUT_FILE") > $(wc -c < "$REPO_FILE") )); then
          cp "$OUT_FILE" "$REPO_FILE"
        fi

        git config user.name updating-bot
        git config user.email github-actions@github.com
        git pull
        git commit "$REPO_FILE" -m "updating bot - $(date '+%Y/%m/%d')"
        git push
